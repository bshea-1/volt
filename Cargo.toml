[package]
name = "volt-lang"
version = "0.1.0"
edition = "2021"
authors = ["Volt Team"]
description = "Volt: A High-Performance, Reactive Web Language Targeting Wasm-GC"
license = "MIT"



[[bin]]
name = "volt"
path = "src/main.rs"

[lib]
name = "volt_core"
path = "src/lib.rs"

[dependencies]
wasm-encoder = "0.259"
wasmparser = "0.259"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
