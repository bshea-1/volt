<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Volt Wasm-GC Live Reactive Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(17, 24, 39, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #3b82f6;
      --primary-glow: rgba(59, 130, 246, 0.4);
      --secondary: #6366f1;
      --danger: #ef4444;
      --text: #f3f4f6;
      --text-dim: #9ca3af;
      --accent-green: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(circle at 20% 20%, rgba(59, 130, 246, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(99, 102, 241, 0.12) 0%, transparent 40%);
      color: var(--text);
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 680px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    header {
      text-align: center;
    }

    header h1 {
      font-size: 2.25rem;
      font-weight: 700;
      background: linear-gradient(135deg, #60a5fa, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-dim);
      font-size: 1rem;
    }

    /* Volt Component Styled Output */
    .counter-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 1.25rem;
      padding: 2rem;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
    }

    .counter-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--primary), transparent);
    }

    .badge {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--primary);
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid rgba(59, 130, 246, 0.25);
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      margin-bottom: 1rem;
    }

    .counter-card h2 {
      font-size: 1.65rem;
      margin-bottom: 0.35rem;
    }

    .description {
      color: var(--text-dim);
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-bottom: 1.75rem;
    }

    .stat-item {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 0.85rem;
      padding: 1rem;
      text-align: center;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .stat-item:hover {
      transform: translateY(-2px);
      border-color: rgba(59, 130, 246, 0.3);
    }

    .stat-label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-bottom: 0.35rem;
      font-weight: 500;
    }

    .stat-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.75rem;
      font-weight: 700;
      color: #fff;
    }

    .actions {
      display: flex;
      gap: 0.75rem;
    }

    button {
      flex: 1;
      font-family: 'Outfit', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      padding: 0.75rem 1.25rem;
      border-radius: 0.75rem;
      border: none;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 4px 14px var(--primary-glow);
    }

    .btn-primary:hover {
      background: #2563eb;
      transform: translateY(-1px);
    }

    .btn-primary:active {
      transform: translateY(1px);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(-1px);
    }

    .btn-secondary:active {
      transform: translateY(1px);
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.12);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.2);
    }

    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.2);
      transform: translateY(-1px);
    }

    .btn-danger:active {
      transform: translateY(1px);
    }

    /* Diagnostics Banner */
    .diagnostics-panel {
      background: rgba(17, 24, 39, 0.5);
      border: 1px solid var(--card-border);
      border-radius: 1rem;
      padding: 1.25rem 1.5rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
    }

    .diag-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
    }

    .diag-item {
      display: flex;
      justify-content: space-between;
      color: var(--text-dim);
    }

    .diag-item span.highlight {
      color: var(--accent-green);
      font-weight: 600;
    }

    footer {
      text-align: center;
      color: var(--text-dim);
      font-size: 0.85rem;
      margin-top: 1rem;
    }

    footer a {
      color: var(--primary);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Volt Wasm-GC Demo</h1>
      <p>High-Performance Reactive Language Compiled to WebAssembly GC</p>
    </header>

    <!-- Mount the compiled Volt Component -->
    <volt-app src="./counter.wasm"></volt-app>

    <!-- Diagnostics Panel -->
    <div class="diagnostics-panel">
      <div class="diag-grid">
        <div class="diag-item">
          <span>Mount Time:</span>
          <span id="mount-timer" class="highlight">0.00 ms</span>
        </div>
        <div class="diag-item">
          <span>GC Allocations:</span>
          <span class="highlight">0 B (Direct DOM)</span>
        </div>
        <div class="diag-item">
          <span>Event Model:</span>
          <span class="highlight">Root Delegation</span>
        </div>
        <div class="diag-item">
          <span>DOM Strategy:</span>
          <span class="highlight">externref Text.nodeValue</span>
        </div>
      </div>
    </div>

    <footer>
      Built with <a href="https://github.com/bshea-1/volt" target="_blank">Volt</a> &bull; Targeting native browser Wasm-GC
    </footer>
  </div>

  <!-- Load the Volt Micro-Bootloader -->
  <script type="module" src="./boot.js"></script>

  <script>
    // Monitor component mount time
    const voltApp = document.querySelector('volt-app');
    const observer = new MutationObserver(() => {
      const duration = voltApp.getAttribute('data-mount-time-ms');
      if (duration) {
        document.getElementById('mount-timer').textContent = `${duration} ms`;
        observer.disconnect();
      }
    });
    observer.observe(voltApp, { attributes: true, attributeFilter: ['data-mount-time-ms'] });
  </script>
</body>
</html>
